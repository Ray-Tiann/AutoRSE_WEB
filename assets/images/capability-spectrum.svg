<svg xmlns="http://www.w3.org/2000/svg" width="960" height="425" viewBox="0 0 960 425" role="img" aria-labelledby="capability-title capability-desc">
<title id="capability-title">Current RSE-Agent reach and the research loop</title>
<desc id="capability-desc">Four conceptual capability levels: code executor, engineering optimizer, algorithmic improver, and conceptual innovator. The engineering optimizer tier is highlighted and explicitly marked Current RSE-Agent Reach. A blue connector joins this level to the iterative ideate, implement, experiment, and analyze research loop. This illustrates the main operating level of current agents, not a measured scale or an absolute capability limit.</desc>
<defs><marker id="cycle-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 8 5 1 9" fill="none" stroke="#7f9fcf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Inter, Arial, Helvetica, sans-serif">
<g id="capability-pyramid" stroke="#fff" stroke-width="3" stroke-linejoin="round">
<path d="M230 24 321.2 190H138.8Z" fill="#e4edf9"/>
<path d="M138.8 190H321.2L361.3 263H98.7Z" fill="#d7e6f9"/>
<path d="M98.7 263H361.3L401.4 336H58.6Z" fill="#bed5f6" stroke="#2759c4" stroke-width="2.5"/>
<path d="M58.6 336H401.4L442 410H18Z" fill="#eaf2fc"/>
</g>
<text x="230" y="157" text-anchor="middle" fill="#243653" font-size="23" font-weight="600">Conceptual<tspan x="230" dy="28">innovator</tspan></text>
<text x="230" y="219" text-anchor="middle" fill="#243653" font-size="24" font-weight="600">Algorithmic<tspan x="230" dy="28">improver</tspan></text>
<text x="230" y="290" text-anchor="middle" fill="#1f4d96" font-size="24" font-weight="600">Engineering<tspan x="230" dy="28">optimizer</tspan></text>
<text x="230" y="381" text-anchor="middle" fill="#243653" font-size="24" font-weight="600">Code executor</text><g id="research-loop">
<text x="780" y="74" text-anchor="middle" fill="#243653" font-size="26" font-weight="600">Research loop</text>
<g fill="none" stroke="#7f9fcf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#cycle-arrow)">
<path d="M765 159H794"/><path d="M870 211V294"/><path d="M795 347H766"/><path d="M690 295V212"/>
</g>
<g class="research-step" aria-label="Ideate">
      <rect x="620" y="112" width="140" height="94" rx="14" fill="#edf3ff" stroke="#b5ccef" stroke-width="2.2"/>
      <g transform="translate(674.0 126)" fill="none" stroke="#2759c4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 23C10 19 5 17 5 11a11 11 0 0 1 22 0c0 6-5 8-5 12M11 27h10M12 31h8M16 2v3M2 11H0M30 11h2M4 1l3 3M25 4l3-3"/><path d="M13 22h6"/></g>
      <text x="690.0" y="183" text-anchor="middle" fill="#243653" font-size="24" font-weight="600">Ideate</text>
    </g><g class="research-step" aria-label="Implement">
      <rect x="800" y="112" width="140" height="94" rx="14" fill="#edf3ff" stroke="#b5ccef" stroke-width="2.2"/>
      <g transform="translate(854.0 126)" fill="none" stroke="#2759c4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="32" height="27" rx="3"/><path d="M1 8h32M6 5h.1M10 5h.1M11 14l-4 4 4 4M23 14l4 4-4 4M19 13l-4 10"/></g>
      <text x="870.0" y="183" text-anchor="middle" fill="#243653" font-size="24" font-weight="600">Implement</text>
    </g><g class="research-step" aria-label="Experiment">
      <rect x="800" y="300" width="140" height="94" rx="14" fill="#edf3ff" stroke="#b5ccef" stroke-width="2.2"/>
      <g transform="translate(854.0 314)" fill="none" stroke="#2759c4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 1h10M13 1v12L4 27a3 3 0 0 0 2.5 4h19a3 3 0 0 0 2.5-4L19 13V1M9 21h14"/><path d="M14 25h.1M21 27h.1"/></g>
      <text x="870.0" y="371" text-anchor="middle" fill="#243653" font-size="24" font-weight="600">Experiment</text>
    </g><g class="research-step" aria-label="Analyze">
