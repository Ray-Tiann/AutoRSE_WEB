<script>(function(root,factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;else root.AutoRSELeaderboardCore=api;})(typeof globalThis==='object'?globalThis:this,function(){
  'use strict';
  const number=value=>typeof value==='number'&&Number.isFinite(value);
  const isPaper=data=>data?.metadata?.provenance==='Paper reference';
  function validData(data){
    if(!data||!Array.isArray(data.tasks)||!Array.isArray(data.task_order)||data.tasks.length!==6||data.task_order.length!==6||new Set(data.task_order).size!==6||!Array.isArray(data.rows))return false;

    if(!paper&&(!data.metadata||typeof data.metadata.data_revision!=='string'||!data.metadata.data_revision||data.metadata.cohort!=='community:'+data.metadata.data_revision))return false;
    if(!data.tasks.every((task,i)=>task.name===data.task_order[i]&&typeof task.metric==='string'&&(!paper||(number(task.baseline_score)&&task.baseline_score>0))))return false;
    const ids=new Set();
    return data.rows.every(row=>{
      if(!row||typeof row.id!=='string'||!row.id||ids.has(row.id)||typeof row.model!=='string'||!row.model||typeof row.harness!=='string'||!row.harness)return false;
      ids.add(row.id);
      if(row.provenance!==(paper?'Paper reference':'Reviewed community'))return false;
      if(!['scores','sd','trial_counts'].every(key=>Array.isArray(row[key])&&row[key].length===6))return false;
      if(paper)return Array.isArray(row.relative_gain_percent)&&row.relative_gain_percent.length===6&&row.scores.every((v,i)=>v===null?row.relative_gain_percent[i]===null:number(v)&&number(row.relative_gain_percent[i])&&number(row.sd[i])&&row.sd[i]>=0&&Number.isInteger(row.trial_counts[i])&&row.trial_counts[i]>0);
      if(!row.scores.every(number)||!row.sd.every(v=>number(v)&&v>=0)||!row.trial_counts.every(v=>v===3))return false;
      if(!Array.isArray(row.task_ranks)||row.task_ranks.length!==6||!row.task_ranks.every(v=>number(v)&&v>=1&&v<=size&&Number.isInteger(v*2)))return false;
      const sum=row.task_ranks.reduce((a,b)=>a+b,0);
      return number(row.rank_sum)&&row.rank_sum===sum&&number(row.mean_task_rank)&&Math.abs(row.mean_task_rank-sum/6)<1e-12&&Number.isInteger(row.overall_rank)&&row.overall_rank>=1&&row.overall_rank<=size;
    });
  }
  function fixedFour(value){
    // Match Decimal(str(value)).quantize(.0001, ROUND_HALF_UP), not binary toFixed ties.
    const [mantissa,exponent='0']=Math.abs(value).toString().toLowerCase().split('e');
    const parts=mantissa.split('.'),digits=BigInt(parts.join(''));
    const shift=Number(exponent)-(parts[1]?.length||0)+4,factor=10n**BigInt(Math.abs(shift));
    const rounded=shift>=0?digits*factor:(digits+factor/2n)/factor;
    const text=rounded.toString().padStart(5,'0');
    return `${value<0&&rounded!==0n?'-':''}${text.slice(0,-4)}.${text.slice(-4)}`;
  }
  const stableOrder=(a,b)=>a.row.model.localeCompare(b.row.model)||a.row.harness.localeCompare(b.row.harness)||a.row.id.localeCompare(b.row.id);
  function taskRanking(data,index){
    const paper=isPaper(data);
    const sorted=data.rows.filter(row=>number(row.scores[index])).map(row=>({row,index,value:paper?row.relative_gain_percent[index]:row.scores[index],score:Number(row.scores[index].toFixed(4)),rank:paper?null:row.task_ranks[index]}));

      sorted.sort((a,b)=>a.rank-b.rank||stableOrder(a,b));
      const best=sorted[0]?.rank;

    }
    sorted.sort((a,b)=>b.score-a.score||stableOrder(a,b));

    const cohort=data.rows.filter(row=>row.scores.every(number));
    const ranks=new Map(cohort.map(row=>[row.id,isPaper(data)?[]:[...row.task_ranks]]));

  }
  return {validData,ranking,isPaper,fixedFour,presentation};
});

      columns.push(element('col',undefined,'score-col'));
      const th=element('th',undefined,'score-cell');th.scope='col';th.append(element('span',task.name),element('span',task.metric,'metric'));head.append(th);
    }
    columns.push(element('col',undefined,'rank-col'));
    const rankHead=element('th','Rank','rank-cell');rankHead.scope='col';head.append(rankHead);
    $('ranking-columns').replaceChildren(...columns);$('ranking-head').replaceChildren(head);
    body.replaceChildren();
    for(const {row,rank,scores:cells} of display.rows){
      const tr=element('tr',undefined,rank===1?'leader':undefined),identity=element('td'),name=element('div',undefined,'agent-name');
      const url=safeHref(row.source_url);
      if(url){const link=element('a',row.model);link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('aria-label',row.model+': result source');name.append(link);}else name.textContent=row.model;
      identity.append(name,element('span',row.harness,'agent-harness'));tr.append(identity);
      if(scores)for(const cell of cells){
        const td=element('td',undefined,'score-cell');
        td.setAttribute('aria-label',`${cell.task}: ${cell.text}; ${cell.trials} trials`);
        td.title=`${cell.trials} trials; ${cell.metric}`;
        td.append(element('span',fixedFour(cell.mean),'score-mean'),element('span','± '+fixedFour(cell.sd),'score-sd'));tr.append(td);
      }
      const result=element('td',undefined,'rank-cell');result.append(element('strong',String(rank),'rank'));tr.append(result);body.append(tr);
    }
    if(!display.rows.length){const tr=element('tr'),td=element('td',display.emptyMessage,'empty');td.colSpan=scores?8:2;tr.append(td);body.append(tr);}
    $('ranking-status').textContent=display.label+', '+display.rows.length+' configurations. '+(scores?'Scores':'Rank')+' view.';
    window.AutoRSELeaderboardState={boards,cohort};
    if(window.AutoRSEInsights)window.AutoRSEInsights.update({boards,cohort});
    resize();
  }
  if(!validData(boards.paper)||!validData(boards.community))throw Error('Invalid bundled leaderboard data');
  $('cohort-select').addEventListener('change',event=>{cohort=event.target.value;explicitCohort=true;render();});
  $('view-rankings').addEventListener('click',()=>{view='rankings';render();});
  $('view-scores').addEventListener('click',()=>{view='scores';render();});
  render();
  async function load(source,file){
    try{
      const response=await fetch(file,{cache:'no-cache'});
      if(source==='community'&&response.status===404)return;
      if(!response.ok)throw Error('Unavailable');
      const next=await response.json();
      if(!validData(next)||(next.metadata.provenance==='Paper reference')!==(source==='paper'))throw Error('Invalid cohort');
      boards[source]=next;
      if(source==='community'&&next.rows.length&&!explicitCohort)cohort='community';
      render();
    }catch{/* Retain the correctly labelled selected cohort when refresh is unavailable. */}
  }
  load('community','community-leaderboard.json');load('paper','leaderboard-data.json');
  if('ResizeObserver'in window)new ResizeObserver(resize).observe(document.querySelector('main'));
  window.addEventListener('resize',resize);window.addEventListener('load',resize);
})();
</script>
</body></html>
